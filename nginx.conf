events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
        proxy_pass http://frontend:80;
        }

        location /api/ {
            proxy_pass http://app:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}